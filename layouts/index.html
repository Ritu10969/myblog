<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Ritu's Space</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;400&display=swap" rel="stylesheet">

<style>
  /* 基础复位 */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body { 
    background-color: #fafafa; 
    color: #333;
    max-width: 600px; 
    margin: 0 auto; 
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center; 
    align-items: center;
    /* 优先使用思源宋体，兜底使用系统衬线字体 */
    font-family: 'Noto Serif SC', 'Hiragino Mincho ProN', 'Source Han Serif SC', 'SimSun', serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  h1 { 
    font-weight: 400; /* 思源宋体 400 刚好 */
    font-size: 1.6rem;
    letter-spacing: 0.12em; 
    margin-bottom: 0.8rem;
    color: #1a1a1a;
  }

  p { 
    color: #999; 
    font-size: 0.85rem; 
    margin-bottom: 3.5rem; 
    letter-spacing: 0.1em;
    /* 让副标题有一种呼吸感 */
    font-weight: 200;
  }

  nav {
    display: flex;
    gap: 40px; /* 链接之间的间距 */
  }

  nav a { 
    text-decoration: none; 
    color: #888; 
    font-size: 12px; 
    letter-spacing: 0.25em;
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    padding-bottom: 5px;
  }

  /* 精致的下划线动画 */
  nav a::after {
    content: '';
    position: absolute;
    width: 0%;
    height: 1px;
    bottom: 0;
    left: 0;
    background-color: #333;
    transition: width 0.4s ease;
  }

  nav a:hover { 
    color: #1a1a1a; 
  }

  nav a:hover::after {
    width: 100%;
  }

  /* 适配移动端 */
  @media (max-width: 480px) {
    h1 { font-size: 1.4rem; }
    p { font-size: 0.8rem; }
  }
 /* 只针对文章正文里的链接进行修改，不影响首页导航 */
  .post-content a, .entry-content a, article a {
    color: #666 !important; /* 变成深灰色，不再是蓝色 */
    text-decoration: underline !important;
    text-decoration-color: #ddd !important;
    text-underline-offset: 3px;
  }

  /* 保持首页导航和底部链接的原始颜色不被干扰 */
  nav a, .position-absolute a, [style*="position: absolute"] a {
    color: inherit;
  }
</style>
</head>
<body>

<h1>🐱 世界毁灭了吗？</h1>
<p>如果警察问起，记得说你没来过</p>

<nav>
  <a href="/categories/recently/">RECENTLY</a>
  <a href="/categories/dust/">DUST</a>
</nav>

<div style="
    position: absolute; 
    right: 30px; 
    bottom: 30px; 
    text-align: right;
">
  <a href="/posts/about-ritu/" style="
    text-decoration: none; 
    color: #bbb; 
    font-size: 11px; 
    letter-spacing: 0.2em; 
    font-weight: 200;
    transition: color 0.4s ease;
  " onmouseover="this.style.color='#888'" onmouseout="this.style.color='#bbb'">
    About Ritu
  </a>
</div>
  
</body>
</html>
