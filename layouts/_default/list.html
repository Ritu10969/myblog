<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{{ .Title }} - Ritu's Space</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;400&display=swap" rel="stylesheet">

<style>
  /* 2. 复制首页的核心样式 */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body { 
    background-color: #fafafa; 
    color: #333;
    max-width: 600px; 
    margin: 0 auto; 
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center; 
    align-items: center;
    /* 保持字体一致 */
    font-family: 'Noto Serif SC', 'Hiragino Mincho ProN', 'Source Han Serif SC', 'SimSun', serif;
    -webkit-font-smoothing: antialiased;
  }

  h1 { 
    font-weight: 400; 
    font-size: 1.2rem; /* 分类页标题稍微小一点，显得精致 */
    letter-spacing: 0.2em; 
    margin-bottom: 3rem;
    color: #999; /* 延续灰调 */
    text-transform: uppercase;
  }

  .post-list {
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
  }

  .post-item { 
    text-decoration: none; 
    color: #444; 
    font-size: 14px; 
    letter-spacing: 0.1em;
    transition: all 0.4s ease;
    border-bottom: 1px solid transparent;
    padding-bottom: 4px;
  }

  .post-item:hover { 
    color: #1a1a1a; 
    border-bottom: 1px solid #333;
  }

  nav {
    margin-top: 80px;
  }

  .back-home { 
    text-decoration: none; 
    color: #ccc; 
    font-size: 11px; 
    letter-spacing: 0.2em;
    text-transform: uppercase;
    transition: color 0.3s;
  }

  .back-home:hover { color: #000; }
</style>
</head>
<body>

  <h1>{{ .Title }}</h1>

  <div class="post-list">
    {{ range .Pages }}
      <a class="post-item" href="{{ .RelPermalink }}">{{ .Title }}</a>
    {{ end }}
  </div>

  <nav>
    <a href="/" class="back-home">← RETURN</a>
  </nav>

</body>
</html>
